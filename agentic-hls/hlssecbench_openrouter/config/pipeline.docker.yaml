agents_config: config/agents.yaml

openrouter:
  base_url: https://openrouter.ai/api/v1
  referer_env: OPENROUTER_REFERER
  title_env: OPENROUTER_TITLE
  timeout_seconds: 120
  max_retries: 0

pipeline:
  max_repair_rounds: 10
  generate_mutants: true
  mutants_per_task: 5

execution:
  # Execution enabled — each step runs inside the PandA-Bambu Docker image.
  # Build the image first:
  #   docker compose build bambu-runner
  allow_execution: true
  timeout_seconds: 300

  docker:
    enabled: true
    # Image built by docker-compose.yml in this project root.
    image: "hlssecbench-openrouter-bambu:latest"
    platform: "linux/amd64"

  # Commands are run from each task workspace (mounted at /workspace).
  # They are intentionally config-controlled, not LLM-controlled.
  steps:
    - name: csim
      command: "bash tests/run_csim.sh"
      required: false
    - name: synth
      command: "bash tests/run_synth.sh"
      required: false
    - name: cosim
      command: "bash tests/run_cosim.sh"
      required: false
    - name: rtl_security
      command: "bash tests/run_rtl_security.sh"
      required: false

quality_gates:
  require_secure_reference_pass: true
  min_c_coverage: 0.80
  min_rtl_coverage: 0.70
  min_security_mutation_score: 0.60
  require_one_mutant_detected_per_security_requirement: true
