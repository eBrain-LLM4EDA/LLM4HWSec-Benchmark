# =============================================================================
# HLSSecBench Agentic — Docker Compose for PandA-Bambu HLS execution
# =============================================================================
#
# Build the image (no env vars required):
#   docker compose build bambu-runner
#
# Run all harness scripts on a task workspace:
#   HLS_BENCH_WORKSPACE=/path/to/runs/demo/my_task \
#       docker compose run --rm bambu-runner
#
# Run a single step:
#   HLS_BENCH_WORKSPACE=/path/to/workspace \
#   HLS_BENCH_TEST_COMMAND="bash tests/run_synth.sh" \
#       docker compose run --rm bambu-runner
#
# The Python pipeline (runner.py) calls `docker run` directly — you only need
# docker-compose here for building the image and manual debugging runs.
# =============================================================================

services:
  bambu-runner:
    build:
      context: .
      dockerfile: docker/bambu/Dockerfile
      # Bambu AppImage is x86_64 only; Rosetta 2 handles emulation on Apple Silicon.
      platforms:
        - linux/amd64
    image: hlssecbench-openrouter-bambu:latest
    platform: linux/amd64
    init: true
    working_dir: /workspace
    network_mode: none
    volumes:
      # HLS_BENCH_WORKSPACE must be set to a task workspace when running.
      # It defaults to the project root so `docker compose build` works without
      # the variable being exported.  At run time, always set it explicitly:
      #   HLS_BENCH_WORKSPACE=/abs/path/to/task  docker compose run --rm bambu-runner
      - type: bind
        source: ${HLS_BENCH_WORKSPACE:-.}
        target: /workspace
    command:
      - bash
      - -lc
      - >-
        ${HLS_BENCH_TEST_COMMAND:-bash tests/run_csim.sh &&
        bash tests/run_synth.sh &&
        bash tests/run_cosim.sh &&
        bash tests/run_rtl_security.sh}
