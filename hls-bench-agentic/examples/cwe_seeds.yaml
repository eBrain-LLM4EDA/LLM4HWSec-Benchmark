# CWE-based seeds for the HLS secure benchmark generator.
# HLS tool: PandA-Bambu (open-source). Docker image: hlssecbench-openrouter-bambu:latest
# Each seed is expanded by the IdeaGenerator agent into a detailed benchmark idea
# before the Architect produces a full task specification.
#
# Allowed PandA-Bambu pragmas:
#   #pragma HLS pipeline       — fix initiation interval of a loop
#   #pragma HLS unroll         — fully unroll a loop
#   #pragma HLS loop_bound N   — assert static loop bound (required for synthesis)
#   #pragma HLS inline         — inline the function at call site
#
# Types: use <stdint.h> types only (uint8_t, uint16_t, uint32_t, uint64_t).
# Do NOT use ap_uint / ap_int — those are Xilinx/Vitis HLS-specific.

- seed_id: cwe385_const_time_compare
  title: Constant-time HLS token comparison
  cwe_ids: ["CWE-385", "CWE-208"]
  security_domain: side_channel
  difficulty: easy
  vulnerability_theme: timing side channel from secret-dependent early exit
  algorithm: fixed-length byte-array comparison (16 bytes)
  language: C (PandA-Bambu)
  top_function_hint: compare_token
  public_description: >
    Implement a synthesizable C function that compares a 16-byte input token
    against a stored 16-byte reference token and returns a match flag (uint8_t 1/0).
    The implementation must not leak information about which byte first differs.
  security_goals:
    - execution latency must be identical for all input values
    - no early return or break on a mismatching byte
    - no secret-dependent loop trip count
    - comparison result must not be observable before all bytes are checked
  constraints:
    - standard C99, no dynamic memory, no recursion
    - all loops must have a static bound annotated with #pragma HLS loop_bound
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS unroll"
    - "#pragma HLS loop_bound 16"
  forbidden_patterns:
    - early return inside comparison loop
    - short-circuit && or || on secret bytes
    - secret-dependent break statement
    - secret-dependent loop bound

- seed_id: cwe200_debug_register_isolation
  title: HLS key register with debug port isolation
  cwe_ids: ["CWE-200", "CWE-201"]
  security_domain: access_control
  difficulty: easy
  vulnerability_theme: sensitive key material exposed through debug or status output
  algorithm: 128-bit key register with enable/disable debug access
  language: C (PandA-Bambu)
  top_function_hint: key_register
  public_description: >
    Implement a synthesizable C function acting as a register bank holding a 128-bit key
    (passed as a uint32_t[4] array).
    A debug_enable input (uint8_t) controls whether a debug_out pointer receives key state.
    When debug_enable is 0, all elements of debug_out must be 0 regardless of key content.
  security_goals:
    - debug_out must be identically 0 when debug_enable is 0
    - key must never appear in any output when debug_enable is 0
    - no implicit forwarding of key bits to status or error outputs
  constraints:
    - standard C99, no dynamic memory, no recursion
    - all loops must have a static bound annotated with #pragma HLS loop_bound
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS loop_bound 4"
  forbidden_patterns:
    - key value written to debug_out unconditionally
    - key bits propagated to any output when debug_enable == 0

- seed_id: cwe212_key_zeroization
  title: HLS key derivation with post-operation zeroization
  cwe_ids: ["CWE-212", "CWE-226"]
  security_domain: resource_isolation
  difficulty: medium
  vulnerability_theme: sensitive key material retained in local variables after operation completes
  algorithm: simple PRF key derivation (XOR-and-rotate chain) with explicit secret clearing
  language: C (PandA-Bambu)
  top_function_hint: derive_session_key
  public_description: >
    Implement a synthesizable C function that derives a 256-bit session key (uint8_t[32])
    from a 256-bit master key (uint8_t[32]) and a 64-bit nonce (uint64_t) using a
    simple XOR-rotate PRF. After writing the derived key to the output array, all local
    arrays holding key material must be explicitly zeroed before the function returns.
  security_goals:
    - all local arrays holding key material must be explicitly zeroed before return
    - master_key bytes must not appear in any output other than derived_key
    - no residual key bytes must remain in any local variable after return
  constraints:
    - standard C99, no dynamic memory, no recursion
    - all loops must have a static bound annotated with #pragma HLS loop_bound
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS loop_bound 32"
  forbidden_patterns:
    - return without zeroing intermediate key arrays
    - master key bytes written directly to output without derivation

- seed_id: cwe284_mmio_privilege_check
  title: HLS memory-mapped security register with privilege check
  cwe_ids: ["CWE-284", "CWE-732"]
  security_domain: access_control
  difficulty: medium
  vulnerability_theme: privileged security register writable from unprivileged software
  algorithm: register bank with privilege-level gating (4 x uint32_t registers)
  language: C (PandA-Bambu)
  top_function_hint: sec_config_reg
  public_description: >
    Implement a synthesizable C function that models a four-register bank (uint32_t regs[4]).
    Register 0 (CTRL) is readable and writable by all privilege levels.
    Register 3 (SEC_KEY_CTRL) is readable only when privilege_level == 3 (returns 0 otherwise)
    and writable only when privilege_level == 3 (writes are silently discarded otherwise).
    Inputs: uint32_t addr, uint32_t wdata, uint8_t write_en, uint8_t privilege_level.
    Output: uint32_t rdata.
  security_goals:
    - writes to register 3 with privilege_level < 3 must be silently discarded
    - reads of register 3 with privilege_level < 3 must return 0
    - privilege_level must be checked before any register state is modified
  constraints:
    - standard C99, no dynamic memory, no recursion
    - all loops must have a static bound annotated with #pragma HLS loop_bound
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS inline"
  forbidden_patterns:
    - write to register 3 without privilege check
    - privilege check placed after register state modification

- seed_id: cwe682_hash_length_overflow
  title: HLS MAC verifier with integer overflow bypass
  cwe_ids: ["CWE-682", "CWE-190"]
  security_domain: side_channel
  difficulty: medium
  vulnerability_theme: integer overflow in message length check allows MAC bypass
  algorithm: constant-time MAC verify over a length-prefixed message
  language: C (PandA-Bambu)
  top_function_hint: verify_mac
  public_description: >
    Implement a synthesizable C function that verifies a message authentication code (MAC).
    Inputs: uint8_t msg[256], uint8_t msg_len, uint8_t expected_mac[32], uint8_t key[32].
    The function computes a MAC (simple XOR-fold of key and msg[0..msg_len-1]) and returns
    1 if it matches expected_mac, 0 otherwise.
    The length field is uint8_t covering 0..255. The implementation must handle the full
    range without integer overflow or wrap-around bypassing the length check.
  security_goals:
    - length check must not be bypassable by integer overflow or wrap-around
    - length must be validated before any data is read from msg beyond index 0
    - MAC comparison must be constant-time (no early exit on first mismatch)
  constraints:
    - standard C99, no dynamic memory, no recursion
    - all loops must have a static bound annotated with #pragma HLS loop_bound
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS loop_bound 256"
    - "#pragma HLS loop_bound 32"
  forbidden_patterns:
    - length cast that discards high bits (e.g. casting uint16_t to uint8_t)
    - early return in MAC comparison loop
    - buffer read before length bounds check

- seed_id: cwe362_shared_counter_race
  title: HLS transaction counter with saturating overflow protection
  cwe_ids: ["CWE-362"]
  security_domain: resource_isolation
  difficulty: easy
  vulnerability_theme: non-atomic read-modify-write on shared security counter enables silent wrap
  algorithm: saturating 32-bit hardware transaction counter
  language: C (PandA-Bambu)
  top_function_hint: increment_counter
  public_description: >
    Implement a synthesizable C function that maintains a static 32-bit transaction counter.
    Each call increments the counter and writes the new value to *out_count.
    If the counter has reached 0xFFFFFFFF, it must saturate: *out_count stays 0xFFFFFFFF
    and *error_flag is set to 1. The counter must never silently wrap to 0.
  security_goals:
    - counter must never silently wrap from 0xFFFFFFFF to 0
    - saturation check must execute before the increment is applied
    - error_flag must be written before out_count when saturating
  constraints:
    - standard C99, no dynamic memory, no recursion
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS inline"
  forbidden_patterns:
    - unchecked uint32_t addition that wraps silently
    - error_flag set after returning the wrapped counter value

- seed_id: cwe693_unrolled_sbox_timing
  title: HLS AES S-box with mandatory loop unrolling to prevent timing leak
  cwe_ids: ["CWE-693", "CWE-385"]
  security_domain: side_channel
  difficulty: hard
  vulnerability_theme: serialized loop over a lookup table creates data-dependent timing variation
  algorithm: AES SubBytes transformation (256-entry substitution table, 16-byte state)
  language: C (PandA-Bambu)
  top_function_hint: sub_bytes
  public_description: >
    Implement a synthesizable C function that applies the AES SubBytes transformation to
    a 16-byte state array (uint8_t state[16]) using a preloaded 256-element S-box ROM
    (uint8_t sbox[256]). All 16 substitutions must complete in the same number of clock
    cycles regardless of the byte values.
  security_goals:
    - all 16 S-box lookups must issue in the same number of clock cycles
    - the loop over the 16 state bytes must be fully unrolled or pipelined with II=1
    - latency must be identical for all 256^16 possible input combinations
  constraints:
    - standard C99, no dynamic memory, no recursion
    - the state loop must carry #pragma HLS unroll or #pragma HLS pipeline
    - all loops must have a static bound annotated with #pragma HLS loop_bound
    - synthesizable by PandA-Bambu
  allowed_pragmas:
    - "#pragma HLS pipeline"
    - "#pragma HLS unroll"
    - "#pragma HLS loop_bound 16"
  forbidden_patterns:
    - serialized loop over state array without pipeline or unroll pragma
    - data-dependent conditional inside the substitution loop
    - loop trip count that varies with state byte value
