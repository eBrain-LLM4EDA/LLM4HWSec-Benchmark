defaults:
  temperature: 0.10
  max_tokens: 16000

# Available Anthropic models on OpenRouter (as of 2026):
#   anthropic/claude-sonnet-4.5   — good balance of capability and cost (default)
#   anthropic/claude-opus-4       — highest capability, use for architect/arbiter/scorer
#   anthropic/claude-haiku-4.5    — fastest and cheapest, suitable for tester/mutator
#   anthropic/claude-sonnet-4.6   — latest sonnet

agents:
  idea_generator:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/idea_generator.md
    schema: schemas/idea_bundle.schema.json
    temperature: 0.20

  architect:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/architect.md
    schema: schemas/task_spec.schema.json
    temperature: 0.10

  expert:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/expert.md
    schema: schemas/file_bundle.schema.json
    temperature: 0.10

  tester:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/tester.md
    schema: schemas/test_bundle.schema.json
    temperature: 0.10

  security_analyzer:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/security_analyzer.md
    schema: schemas/analyzer_report.schema.json
    temperature: 0.00

  arbiter:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/arbiter.md
    schema: schemas/arbiter_decision.schema.json
    temperature: 0.00

  mutator:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/mutator.md
    schema: schemas/mutation_bundle.schema.json
    temperature: 0.20

  scorer:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/scorer.md
    schema: schemas/score_report.schema.json
    temperature: 0.00

  target_model:
    model: anthropic/claude-sonnet-4.5
    prompt: prompts/target_model.md
    schema: schemas/file_bundle.schema.json
    temperature: 0.20
