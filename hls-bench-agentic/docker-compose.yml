services:
  bambu-tests:
    image: ${HLS_BENCH_BAMBU_IMAGE:-hlssecbench-openrouter-bambu:latest}
    platform: linux/amd64
    init: true
    working_dir: /workspace
    network_mode: none
    volumes:
      - type: bind
        source: ${HLS_BENCH_WORKSPACE:-.}
        target: /workspace
    command:
      - bash
      - -lc
      - ${HLS_BENCH_TEST_COMMAND:-bash tests/run_csim.sh && bash tests/run_synth.sh && bash tests/run_cosim.sh && bash tests/run_rtl_security.sh}
