services:
  bambu-tests:
    build:
      context: .
      dockerfile: docker/bambu/Dockerfile
    image: hls-bench-agentic-bambu:latest
    init: true
    working_dir: /workspace
    network_mode: none
    volumes:
      - type: bind
        source: ${HLS_BENCH_WORKSPACE:?Set HLS_BENCH_WORKSPACE to the task workspace directory}
        target: /workspace
    command:
      - bash
      - -lc
      - ${HLS_BENCH_TEST_COMMAND:-bash tests/run_csim.sh && bash tests/run_synth.sh && bash tests/run_cosim.sh && bash tests/run_rtl_security.sh}
