[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hls-bench-agentic"
version = "0.1.0"
description = "Agentic HLS security benchmark generator and evaluator using OpenRouter"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.52.0",
  "PyYAML>=6.0.1",
  "jsonschema>=4.23.0",
  "python-dotenv>=1.0.1",
  "rich>=13.7.1",
  "libclang>=16.0.0",
]

[project.scripts]
hlsbench = "hls_bench_agentic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
