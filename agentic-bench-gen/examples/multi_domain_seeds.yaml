- seed_id: hls_ift_crypto_kernel
  domain_id: hls_security_codegen
  title: Information-flow hardened crypto HLS kernel
  objective: Add information-flow tracking checks to a small HLS crypto kernel and evaluate leakage prevention.
  constraints:
    - Use C/C++ compatible with PandA-Bambu style HLS.
    - Keep the CWE/security-property list in the hidden spec only (it drives the private evaluation harness and must never appear as a public input artifact).
    - Include synthesis-oriented checks.
  threat_model: Secret key bytes must not influence public status outputs except through approved ciphertext/data outputs.
  ground_truth: Secret-to-public flows are allowed only through explicitly listed declassified outputs.

- seed_id: rtl_aes_rare_trigger
  domain_id: rtl_trojan_detection
  title: Rare-trigger Trojan in AES-like RTL
  objective: Detect suspicious trigger and payload logic in a compact RTL module.
  constraints:
    - Keep RTL under 200 lines.
    - Include private trigger/payload annotation.
  threat_model: Attacker inserts dormant logic activated by a rare counter state.
  ground_truth: Trigger is a rare state comparator; payload corrupts one output bit.

- seed_id: gate_aes_suspect_nodes
  domain_id: gate_trojan_detection
  title: Gate-level Trojan suspect-node localization
  objective: Classify a small synthesized-style netlist as infected and identify trigger/payload nodes.
  constraints:
    - Use simple Verilog primitives/assign gates.
    - Include node labels in ground truth.
  threat_model: An attacker inserts a low-activity trigger cone and output-corrupting payload after synthesis; the analyst must distinguish it from legitimate rare logic.
  ground_truth: Suspect nodes include rare trigger AND tree and payload XOR near output.

- seed_id: reverse_flattened_adder_tree
  domain_id: hardware_reverse_engineering
  title: Recover adder tree from flattened netlist
  objective: Recover word-level intent and RTL from an obfuscated gate/bit-level design.
  constraints:
    - Include public netlist and hidden word-level RTL.
    - Metrics should include structural match and functional equivalence hooks.
  threat_model: A flattened implementation conceals arithmetic structure and signal grouping from an analyst who must recover maintainable RTL.
  ground_truth: The design implements a 32-bit adder tree over four 16-bit inputs.

- seed_id: rtl_fault_tmr_candidates
  domain_id: side_channel_fault_analysis
  title: SEU hardening candidate identification
  objective: Analyze RTL and fault model to identify vulnerable flip-flops requiring TMR.
  constraints:
    - Include fault model and expected hardening suggestions.
  threat_model: A single-event upset can corrupt persistent control state and cause silent malfunction unless critical registers are identified for redundancy.
  ground_truth: State/control registers are critical; data pipeline registers have lower priority.

- seed_id: locked_c880_xor_keys
  domain_id: logic_deobfuscation_sat
  title: XOR key-gate localization in locked combinational netlist
  objective: Identify key gates and recover a partial key from a logic-locked netlist.
  constraints:
    - Use a compact ISCAS-style combinational netlist.
    - Include private key and key-gate labels.
  threat_model: An attacker has the locked netlist and limited oracle vectors and attempts to identify lock gates and recover key bits.
  ground_truth: XOR key gates protect selected internal signals; partial key is recoverable from oracle vectors.
