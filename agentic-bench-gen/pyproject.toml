[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-bench-gen"
version = "0.1.0"
description = "Modular agentic benchmark generation pipeline for hardware security and reliability tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.22",
  "openai>=1.0",
  "pyyaml>=6.0",
  "rich>=13.0",
]

[project.scripts]
agentic-bench-gen = "agentic_bench_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

