agents_config: config/agents.yaml

openrouter:
  base_url: https://openrouter.ai/api/v1
  referer_env: OPENROUTER_REFERER
  title_env: OPENROUTER_TITLE
  timeout_seconds: 120
  max_retries: 3

pipeline:
  expand_seeds: true
  max_repair_rounds: 2
  # HardSecBench-style construction keeps golden artifacts and harnesses in
  # independent branches, then reconciles failures through the Arbiter.
  hardsecbench_style: true
  generate_mutants: true
  mutants_per_case: 5

validation:
  require_case_readme: true
  require_requirement_harnesses: true
  require_domain_metric: true
  min_coverage_score: 0.80
  min_mutation_score: 0.50
